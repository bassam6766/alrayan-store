<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الريان | متجر فاخر للأدوات البلاستيكية والمنظفات</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Navbar -->
  <header class="nav" id="nav">
    <div class="container nav-row">
      <a href="index.html" class="brand">
        <div class="brand-logo" data-brand-letter>ر</div>
        <div class="brand-text">
          <span class="brand-name" data-i18n="brand"></span>
          <span class="brand-sub" data-i18n="store_kind">متجر فاخر</span>
        </div>
      </a>

      <nav class="nav-links">
        <button class="nav-link" data-scroll="top" data-i18n="nav.home"></button>
        <button class="nav-link" data-scroll="categories" data-i18n="nav.categories"></button>
        <button class="nav-link" data-scroll="bestsellers" data-i18n="nav.bestsellers"></button>
        <button class="nav-link" data-scroll="footer" data-i18n="nav.contact"></button>
      </nav>

      <div class="nav-actions">
        <button class="lang-btn" id="lang-toggle"></button>
        <button class="icon-btn" id="cart-open" aria-label="cart">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
          <span class="cart-count" id="cart-count" style="display:none">0</span>
        </button>
        <button class="menu-toggle" id="menu-toggle" aria-label="menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>
    <div class="mobile-menu" id="mobile-menu">
      <nav>
        <button data-scroll="top" data-i18n="nav.home"></button>
        <button data-scroll="categories" data-i18n="nav.categories"></button>
        <button data-scroll="bestsellers" data-i18n="nav.bestsellers"></button>
        <button data-scroll="footer" data-i18n="nav.contact"></button>
        <button id="lang-toggle-mobile"></button>
      </nav>
    </div>
  </header>

  <!-- Hero -->
  <section id="top" class="hero">
    <div class="container hero-grid">
      <div>
        <div class="eyebrow">
          <span class="line"></span>
          <span class="text" data-i18n="hero.eyebrow"></span>
        </div>
        <h1 data-i18n="hero.title"></h1>
        <p data-i18n="hero.subtitle"></p>
        <div class="hero-ctas">
          <button class="btn" data-scroll="all-products"><span data-i18n="hero.cta"></span> →</button>
          <button class="btn btn-outline" data-scroll="footer" data-i18n="hero.cta2"></button>
        </div>
        <div class="delivery"><span class="dot"></span><span data-i18n="hero.delivery"></span></div>
      </div>
      <div class="hero-img-wrap">
        <div class="hero-img-frame"></div>
        <img src="images/hero.jpg" alt="" class="hero-img" onerror="this.src='images/placeholder.jpg'" />
        <div class="hero-badge">
          <div class="l">EST.</div>
          <div class="v">2026</div>
        </div>
      </div>
    </div>
  </section>

  <!-- Banner Slider -->
  <section class="banner-section">
    <div class="container">
      <div class="banner" id="banner-slider">
        <!-- slides injected -->
        <button class="banner-nav banner-prev" aria-label="prev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
        <button class="banner-nav banner-next" aria-label="next"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>
        <div class="banner-dots" id="banner-dots"></div>
      </div>
    </div>
  </section>

  <!-- Categories -->
  <section id="categories" class="section">
    <div class="container">
      <div class="section-head">
        <div class="divider"><span class="label" data-i18n_text="ar:أقسامنا|en:Our Sections"></span></div>
        <h2 class="section-title" data-i18n="sec.categories"></h2>
        <p class="section-sub" data-i18n="sec.categories_sub"></p>
      </div>
      <div class="cat-grid" id="cat-grid"></div>
    </div>
  </section>

  <!-- Best Sellers -->
  <section id="bestsellers" class="section bg-cream">
    <div class="container">
      <div class="section-head">
        <div class="divider"><span class="label" data-i18n_text="ar:اختياراتنا|en:Our Picks"></span></div>
        <h2 class="section-title" data-i18n="sec.bestsellers"></h2>
        <p class="section-sub" data-i18n="sec.bestsellers_sub"></p>
      </div>
      <div class="product-grid" id="bestsellers-grid"></div>
    </div>
  </section>

  <!-- All Products -->
  <section id="all-products" class="section">
    <div class="container">
      <div class="section-head">
        <div class="divider"><span class="label" data-i18n_text="ar:كتالوج|en:Catalog"></span></div>
        <h2 class="section-title" data-i18n="sec.all"></h2>
      </div>
      <div class="search-wrap">
        <span class="icon-search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
        <input type="text" id="search-input" />
        <button class="icon-clear" id="search-clear" style="display:none" aria-label="clear">×</button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="product-grid" id="products-grid"></div>
      <div id="no-results" style="display:none; text-align:center; color: var(--color-muted); padding: 64px 0;"></div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="footer" class="footer">
    <div class="container">
      <div class="footer-grid">
        <div>
          <div class="brand">
            <div class="brand-logo" data-brand-letter>ر</div>
            <div class="brand-text">
              <span class="brand-name" data-i18n="brand"></span>
              <span class="brand-sub" data-i18n="tagline"></span>
            </div>
          </div>
          <p class="footer-about" data-i18n="footer.about"></p>
          <div style="display:flex; gap:10px;">
            <a href="#" class="icon-btn" style="background:transparent; border-color:rgba(255,255,255,0.2); color:#fff;" aria-label="instagram">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
            </a>
          </div>
        </div>
        <div>
          <h4 data-i18n="footer.links"></h4>
          <ul>
            <li><button class="nav-link" data-scroll="top" data-i18n="nav.home" style="color:rgba(255,255,255,0.7); background:none; border:0; padding:0;"></button></li>
            <li><button class="nav-link" data-scroll="categories" data-i18n="nav.categories" style="color:rgba(255,255,255,0.7); background:none; border:0; padding:0;"></button></li>
            <li><button class="nav-link" data-scroll="bestsellers" data-i18n="nav.bestsellers" style="color:rgba(255,255,255,0.7); background:none; border:0; padding:0;"></button></li>
            <li><a href="login.html" data-i18n="nav.admin"></a></li>
          </ul>
        </div>
        <div>
          <h4 data-i18n="footer.contact"></h4>
          <ul>
            <li id="footer-phone">+965 9999 9999</li>
            <li data-i18n_text="ar:الكويت|en:Kuwait"></li>
            <li data-i18n="footer.hours"></li>
          </ul>
        </div>
      </div>
      <div class="footer-bottom">
        <span data-i18n="footer.rights"></span>
        <span>EST. 2026</span>
      </div>
    </div>
  </footer>

  <!-- Cart Drawer -->
  <div class="overlay" id="cart-overlay"></div>
  <aside class="drawer" id="cart-drawer">
    <div class="drawer-head">
      <h3 class="drawer-title" data-i18n="cart.title"></h3>
      <button class="drawer-close" id="cart-close">✕</button>
    </div>
    <div class="drawer-body" id="cart-items">
      <div class="empty-state" id="cart-empty">
        <div class="h" data-i18n="cart.empty"></div>
        <div class="s" data-i18n="cart.empty_sub"></div>
      </div>
    </div>
    <div class="drawer-foot" id="cart-foot" style="display:none">
      <div class="cart-total-row">
        <span class="cart-total-label" data-i18n="cart.subtotal"></span>
        <span class="cart-total-val" id="cart-total">0.000 KD</span>
      </div>
      <button class="btn btn-block" id="checkout-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <span data-i18n="cart.checkout"></span>
      </button>
    </div>
  </aside>

  <script src="js/config.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
