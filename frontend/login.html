<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الإدارة | الريان</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="login-shell">
    <div class="login-left">
      <div class="inner">
        <div class="logo" data-brand-letter>ر</div>
        <h1 data-i18n="brand"></h1>
        <p class="sub" data-i18n="tagline"></p>
        <div style="height:1px; width:64px; background: var(--color-gold); margin: 24px auto 0;"></div>
      </div>
    </div>

    <div class="login-right">
      <div class="login-card">
        <div class="top">
          <a href="index.html">← <span data-i18n_text="ar:الرئيسية|en:Home"></span></a>
          <button id="lang-toggle"></button>
        </div>

        <div class="eyebrow">
          <span class="line"></span>
          <span class="text" data-i18n_text="ar:الإدارة|en:Admin"></span>
        </div>
        <h2 data-i18n="admin.login_title"></h2>

        <form id="login-form">
          <div class="form-row">
            <label data-i18n="admin.username"></label>
            <div class="field-with-icon">
              <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
              <input type="text" id="username" required />
            </div>
          </div>
          <div class="form-row">
            <label data-i18n="admin.password"></label>
            <div class="field-with-icon">
              <span class="icon"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
              <input type="password" id="password" required />
            </div>
          </div>
          <div id="login-error" class="error-box" style="display:none"></div>
          <button class="btn btn-block" type="submit" id="login-submit">
            <span data-i18n="admin.login"></span>
            →
          </button>
        </form>

        <div style="margin-top: 48px; text-align: center; font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--color-muted);">
          <span data-i18n_text="ar:وصول مقيّد للمدراء فقط|en:Restricted access · admin only"></span>
        </div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/lang.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
